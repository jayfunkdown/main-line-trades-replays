#!/usr/bin/env python3

import json
import os
import urllib.request
from datetime import datetime
from zoneinfo import ZoneInfo

CALENDAR_URL = (
    "https://nfs.faireconomy.media/"
    "ff_calendar_thisweek.json"
)

WEBHOOK_URL = os.environ["ECONOMIC_CALENDAR_WEBHOOK"].strip()

EASTERN = ZoneInfo("America/New_York")


def fetch_calendar():
    request = urllib.request.Request(
        CALENDAR_URL,
        headers={
            "User-Agent": "MainLineTrades-EconomicCalendar/1.0"
        },
    )

    with urllib.request.urlopen(request, timeout=30) as response:
        return json.loads(response.read().decode("utf-8"))


def todays_usd_high_impact_events(events):
    today = datetime.now(EASTERN).date()
    results = []

    for event in events:
        # Only high-impact USD events
        if event.get("impact") != "High":
            continue

        if event.get("country") != "USD":
            continue

        event_time = datetime.fromisoformat(event["date"])
        event_time = event_time.astimezone(EASTERN)

        if event_time.date() != today:
            continue

        results.append(
            {
                "title": event.get("title", "Unknown Event"),
                "time": event_time,
                "forecast": event.get("forecast", ""),
                "previous": event.get("previous", ""),
            }
        )

    return sorted(results, key=lambda item: item["time"])


def format_value(value):
    return value if value else "Not listed"


def format_eastern_time(event_time):
    # Works on GitHub's Linux runner and removes a leading zero.
    return event_time.strftime("%I:%M %p").lstrip("0")


def build_message(events):
    today = datetime.now(EASTERN)

    lines = [
        "# 🗓️ High-Impact U.S. Economic Calendar",
        "",
        f"📅 **{today.strftime('%A, %B %d, %Y')}**",
        "",
    ]

    if not events:
        lines.extend(
            [
                "✅ No high-impact U.S. economic releases "
                "are scheduled for today.",
                "",
                "Always remain alert for unscheduled news "
                "and unexpected market volatility.",
                "",
                "Stay disciplined and have a great trading session! 📈",
            ]
        )
        return "\n".join(lines)

    lines.extend(
        [
            "## 🚨 Today's High-Impact USD Events",
            "",
            "These are the scheduled release times when traders "
            "should be prepared for increased market volatility.",
            "",
        ]
    )

    for event in events:
        time_text = format_eastern_time(event["time"])

        lines.extend(
            [
                f"### 🇺🇸 {time_text} ET — {event['title']}",
                "",
                f"🎯 **Forecast:** {format_value(event['forecast'])}",
                f"📉 **Previous:** {format_value(event['previous'])}",
                "",
            ]
        )

    lines.extend(
        [
            "## ⚠️ Trading Reminder",
            "",
            "High-impact releases may cause:",
            "",
            "⚡ Rapid volatility",
            "",
            "📊 Wider spreads",
            "",
            "🎯 Increased slippage",
            "",
            "📈 Sudden changes in price action",
            "",
            "Know the release times, protect your positions, "
            "and manage your risk accordingly.",
        ]
    )

    return "\n".join(lines)


def post_to_discord(message):
    payload = json.dumps(
        {
            "username": "Main Line Trades Economic Calendar",
            "content": message,
            "allowed_mentions": {"parse": []},
        }
    ).encode("utf-8")

    request = urllib.request.Request(
        WEBHOOK_URL,
        data=payload,
        headers={
            "Content-Type": "application/json",
            "User-Agent": "MainLineTrades-EconomicCalendar/1.0",
        },
        method="POST",
    )

    with urllib.request.urlopen(request, timeout=30) as response:
        if response.status not in (200, 204):
            raise RuntimeError(
                f"Discord returned HTTP {response.status}"
            )


def main():
    events = fetch_calendar()
    todays_events = todays_usd_high_impact_events(events)
    message = build_message(todays_events)
    post_to_discord(message)

    print(
        f"Posted {len(todays_events)} high-impact USD event(s) "
        "to Discord."
    )


if __name__ == "__main__":
    main()
