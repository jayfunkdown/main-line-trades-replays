name: Post Daily Economic Calendar

on:
  schedule:
    - cron: "45 9 * * 1-5"
  workflow_dispatch:

jobs:
  post-economic-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post economic calendar to Discord
        env:
          ECONOMIC_CALENDAR_WEBHOOK: ${{ secrets.ECONOMIC_CALENDAR_WEBHOOK }}
        run: python scripts/economic_calendar.py
