name: Filter TrendSpider Charts

on:
  workflow_dispatch:

jobs:
  filter-trendspider:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Filter TrendSpider posts
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TRENDSPIDER_RAW_CHANNEL_ID: ${{ secrets.TRENDSPIDER_RAW_CHANNEL_ID }}
          TRENDSPIDER_WEBHOOK: ${{ secrets.TRENDSPIDER_WEBHOOK }}
        run: python scripts/trendspider_filter.py

      - name: Save processed message IDs
        run: |
          if git status --porcelain data/trendspider_processed.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/trendspider_processed.json
            git commit -m "Update TrendSpider processed IDs"
            git push
          else
            echo "No state changes to commit."
          fi
